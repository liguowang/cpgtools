[project]
name = "cpgtools"
version = "3.0.0"

description = "Python tools for DNA methylation analysis, imputation, epigenetic clocks, and cell-type deconvolution."

readme = "README.md"
license = {text = "MIT"}

requires-python = ">=3.9"

authors = [
    {name = "Liguo Wang", email = "wangliguo78@gmail.com"},
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "umap-learn>=0.5",
    "bx-python>=0.11",
    "weblogo>=3.7",
    "pycombat>=0.20",
    "fancyimpute>=0.7",
]

keywords = [
    "dna methylation",
    "epigenetics",
    "epigenetic clock",
    "cell deconvolution",
    "450K",
    "EPIC",
    "RRBS",
    "WGBS",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
