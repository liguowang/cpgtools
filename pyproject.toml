[project]
name = "cpgtools"
version = "3.0.3"

description = "Python tools for DNA methylation analysis, imputation, epigenetic clocks, and cell-type deconvolution."

readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

requires-python = ">=3.9"

authors = [
    {name = "Liguo Wang", email = "wangliguo78@gmail.com"},
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "umap-learn>=0.5",
    "bx-python>=0.11",
    "weblogo>=3.7",
    "pycombat>=0.20",
    "EpigeneticPacemaker",
    "rpy2",
    "GPy",
]

keywords = [
    "dna methylation",
    "epigenetics",
    "epigenetic clock",
    "cell deconvolution",
    "450K",
    "EPIC",
    "RRBS",
    "WGBS",
]

classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
epical = "cpgmodule.cli.epical:main"
beta_combat = "cpgmodule.cli.beta_combat:main"
beta_deconvolution = "cpgmodule.cli.beta_deconvolution:main"
beta_impute = "cpgmodule.cli.beta_impute:main"
beta_jitter_plot = "cpgmodule.cli.beta_jitter_plot:main"
beta_m_conversion = "cpgmodule.cli.beta_m_conversion:main"
beta_PCA = "cpgmodule.cli.beta_PCA:main"
beta_profile_gene_centered = "cpgmodule.cli.beta_profile_gene_centered:main"
beta_profile_region = "cpgmodule.cli.beta_profile_region:main"
beta_selectNBest = "cpgmodule.cli.beta_selectNBest:main"
beta_stacked_barplot = "cpgmodule.cli.beta_stacked_barplot:main"
beta_stats = "cpgmodule.cli.beta_stats:main"
beta_topN = "cpgmodule.cli.beta_topN:main"
beta_trichotmize = "cpgmodule.cli.beta_trichotmize:main"
beta_tSNE = "cpgmodule.cli.beta_tSNE:main"
beta_UMAP = "cpgmodule.cli.beta_UMAP:main"
CpG_aggregation = "cpgmodule.cli.CpG_aggregation:main"
CpG_anno_position = "cpgmodule.cli.CpG_anno_position:main"
CpG_anno_probe = "cpgmodule.cli.CpG_anno_probe:main"
CpG_density_gene_centered = "cpgmodule.cli.CpG_density_gene_centered:main"
CpG_distrb_chrom = "cpgmodule.cli.CpG_distrb_chrom:main"
CpG_distrb_gene_centered = "cpgmodule.cli.CpG_distrb_gene_centered:main"
CpG_distrb_region = "cpgmodule.cli.CpG_distrb_region:main"
CpG_logo = "cpgmodule.cli.CpG_logo:main"
CpG_to_gene = "cpgmodule.cli.CpG_to_gene:main"
dmc_Bayes = "cpgmodule.cli.dmc_Bayes:main"
dmc_bb = "cpgmodule.cli.dmc_bb:main"
dmc_fisher = "cpgmodule.cli.dmc_fisher:main"
dmc_glm = "cpgmodule.cli.dmc_glm:main"
dmc_logit = "cpgmodule.cli.dmc_logit:main"
dmc_nonparametric = "cpgmodule.cli.dmc_nonparametric:main"
dmc_ttest = "cpgmodule.cli.dmc_ttest:main"
predict_sex = "cpgmodule.cli.predict_sex:main"

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpgmodule = [
    "deconv_data/*",
    "deconv_data/**/*",
]
dmc = [
    "data/*",
    "data/**/*",
]

